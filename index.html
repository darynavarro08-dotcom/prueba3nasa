<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stellar Health</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <a class="brand" href="#inicio" aria-label="Stellar Health, ir a inicio">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="var(--space-2)"/>
        <circle cx="24" cy="24" r="19.5" fill="none" stroke="var(--aurora-b)" stroke-width="1.4" stroke-dasharray="2.2 3.2" stroke-linecap="round"/>
        <path d="M8.5 25.5h7.2l3.1-8.6 5 15.6 4.1-10.4 2.2 3.4h9.4" fill="none" stroke="var(--aurora-a)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34.5 8.2l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z" fill="var(--star)"/>
      </svg>
      <span class="brand-t"><strong>Stellar Health</strong><small>Salud más allá de la Tierra</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="side-foot">
      <button class="who" id="who" data-act="perfil" aria-label="Cambiar de tripulante"></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="wrap">
        <a class="brand brand-mini" href="#inicio" aria-label="Stellar Health, ir a inicio">
          <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="23" fill="var(--space-2)"/>
            <circle cx="24" cy="24" r="19.5" fill="none" stroke="var(--aurora-b)" stroke-width="1.4" stroke-dasharray="2.2 3.2" stroke-linecap="round"/>
            <path d="M8.5 25.5h7.2l3.1-8.6 5 15.6 4.1-10.4 2.2 3.4h9.4" fill="none" stroke="var(--aurora-a)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M34.5 8.2l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z" fill="var(--star)"/>
          </svg>
          <strong>Stellar Health</strong>
        </a>
        <p class="mision" id="mision"></p>
        <span class="grow"></span>
        <button class="chip-btn" id="med-btn" data-act="med-open"></button>
        <button class="icon-btn" id="bell-btn" data-act="bell" aria-label="Notificaciones" aria-expanded="false" aria-controls="bell-pop"></button>
        <button class="btn btn-crit btn-sm" data-act="sos" aria-label="Pedir ayuda o ver guías de emergencia">SOS</button>
      </div>
    </header>
    <div class="wrap" id="alerts-slot" aria-live="assertive"></div>
    <main class="wrap" id="view" tabindex="-1"></main>
    <footer class="wrap foot">
      <p>Prototipo educativo. Los valores de salud los anota cada persona con sus propias mediciones. No es un dispositivo médico y no sustituye el protocolo médico de la misión ni la indicación del médico de vuelo.</p>
    </footer>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="pop" id="bell-pop" hidden></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<script src="js/01-core.js"></script>
<script src="js/02-content.js"></script>
<script src="js/02b-perfil.js"></script>
<script src="js/03-data.js"></script>
<script src="js/04-engine.js"></script>
<script src="js/05-charts.js"></script>
<script src="js/06-iu.js"></script>
<script src="js/07-app.js"></script>
</body>
</html>
